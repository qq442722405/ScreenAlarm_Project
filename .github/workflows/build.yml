name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包EXE
        run: |
          pyinstaller ^
            --noconfirm ^
            --onefile ^
            --windowed ^
            --name "屏幕数值监控报警" ^
            --icon=favicon.ico ^
            --add-data "models;models" ^
            --add-data "favicon.ico;." ^
            --collect-all PySide6 ^
            --collect-all cv2 ^
            main.py


      - name: 上传EXE
        uses: actions/upload-artifact@v4
        with:
          name: 屏幕数值监控报警
          path: dist/屏幕数值监控报警.exe
