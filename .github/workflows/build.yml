name: Windows EXE Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 拉取代码
    - name: Checkout
      uses: actions/checkout@v4


    # 安装 Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    # 更新 pip
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip


    # 安装依赖
    - name: Install requirements
      run: |
        pip install -r requirements.txt


    # 安装 PyInstaller
    - name: Install PyInstaller
      run: |
        pip install pyinstaller


    # 打包 EXE
    - name: Build EXE
      run: |
        pyinstaller ^
          --noconfirm ^
          --clean ^
          --onefile ^
          --windowed ^
          --name "屏幕数值监控报警" ^
          --icon 1.ico ^
          main.py


    # 上传生成文件
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: 屏幕数值监控报警
        path: dist/屏幕数值监控报警.exe
