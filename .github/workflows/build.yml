name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🐍 配置 Python 环境 (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: 📦 安装项目依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔨 使用 PyInstaller 打包应用
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="屏幕数值监控报警" --icon="favicon.ico" --collect-all ddddocr --add-data "警报声.mp3;." --add-data "favicon.ico;." main.py

    - name: 📤 上传打包后的文件 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: 屏幕数值监控报警-Windows
        path: dist/屏幕数值监控报警/
