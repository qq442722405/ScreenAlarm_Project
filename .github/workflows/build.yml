name: 手动打包 Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🐍 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: 🔎 查找项目目录
      id: project
      shell: pwsh
      run: |
        $req = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter requirements.txt -File -Recurse | Select-Object -First 1
        if (-not $req) {
          Write-Error "找不到 requirements.txt。请确认 requirements.txt 已提交到 GitHub 仓库。"
          exit 1
        }

        $projectDir = $req.Directory.FullName
        $main = Join-Path $projectDir 'main.py'
        if (-not (Test-Path $main)) {
          Write-Error "找到 requirements.txt，但同目录没有 main.py：$projectDir"
          exit 1
        }

        "project_dir=$projectDir" >> $env:GITHUB_OUTPUT
        Write-Host "项目目录：$projectDir"

    - name: 📦 安装项目依赖
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r "${{ steps.project.outputs.project_dir }}\requirements.txt"
        python -m pip install pyinstaller

    - name: 🔨 打包 Windows 程序
      shell: pwsh
      working-directory: ${{ steps.project.outputs.project_dir }}
      run: |
        python -m PyInstaller --noconfirm --onedir --windowed --name="屏幕数值监控报警" --icon="favicon.ico" --collect-all ddddocr --add-data "警报声.mp3;." --add-data "favicon.ico;." main.py

    - name: 📦 生成固定下载压缩包
      shell: pwsh
      working-directory: ${{ steps.project.outputs.project_dir }}
      run: |
        if (Test-Path "屏幕数值监控报警-Windows.zip") {
          Remove-Item "屏幕数值监控报警-Windows.zip" -Force
        }
        # 压缩包打开后第一层就是“屏幕数值监控报警”目录
        Compress-Archive -Path "dist\屏幕数值监控报警" -DestinationPath "屏幕数值监控报警-Windows.zip" -Force
        Write-Host "生成：$(Join-Path (Get-Location) '屏幕数值监控报警-Windows.zip')"

    - name: 📤 上传固定下载文件
      uses: actions/upload-artifact@v4
      with:
        name: 屏幕数值监控报警-Windows
        path: ${{ steps.project.outputs.project_dir }}/屏幕数值监控报警-Windows.zip
        if-no-files-found: error
