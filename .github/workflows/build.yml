name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4

    - name: 🐍 配置 Python 环境 (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: 🔎 查找项目目录
      id: project
      shell: pwsh
      run: |
        $req = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter requirements.txt -File -Recurse | Select-Object -First 1
        if (-not $req) {
          Write-Error "找不到 requirements.txt。请确认 requirements.txt 已提交到 GitHub 仓库。"
          exit 1
        }

        $projectDir = $req.Directory.FullName
        $main = Join-Path $projectDir 'main.py'
        if (-not (Test-Path $main)) {
          Write-Error "找到 requirements.txt，但同目录没有 main.py：$projectDir"
          exit 1
        }

        "project_dir=$projectDir" >> $env:GITHUB_OUTPUT
        Write-Host "项目目录：$projectDir"

    - name: 📦 安装项目依赖
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ steps.project.outputs.project_dir }}\requirements.txt"

    - name: 🔨 使用 PyInstaller 打包应用
      shell: pwsh
      working-directory: ${{ steps.project.outputs.project_dir }}
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="屏幕数值监控报警" --icon="favicon.ico" --collect-all ddddocr --add-data "警报声.mp3;." --add-data "favicon.ico;." main.py

    - name: 📤 上传打包后的文件 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: 屏幕数值监控报警-Windows
        path: ${{ steps.project.outputs.project_dir }}/dist/屏幕数值监控报警/
